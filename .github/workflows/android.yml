name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare preinstalled Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Set CI version
        run: |
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          sed -i "s/versionCode = [0-9]*/versionCode = ${GITHUB_RUN_NUMBER}/" app/build.gradle.kts
          sed -i "s/versionName = \"[0-9.]*\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts
          echo "ABATERY ${VERSION_NAME}"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK for download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            "app/build/outputs/apk/debug/ABATERY-v${VERSION_NAME}-debug.apk"

      - name: Upload APK as standalone artifact
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: ABATERY-v${{ env.VERSION_NAME }}-debug.apk
          path: app/build/outputs/apk/debug/ABATERY-v${{ env.VERSION_NAME }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add APK download link to summary
        run: |
          echo "## 📱 ABATERY v${VERSION_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### APK generada correctamente" >> "$GITHUB_STEP_SUMMARY"
          echo "**Versión:** ${VERSION_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build:** #${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Archivo:** ABATERY-v${VERSION_NAME}-debug.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "[⬇️ Descargar APK](${{ steps.apk.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \\`${GITHUB_SHA::12}\\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: ABATERY v${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/ABATERY-v${{ env.VERSION_NAME }}-debug.apk
