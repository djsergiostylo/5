name: Android CI

on:
  push:
    branches: ["main", "feat/abateri-3d-complete", "fix/abatery-final-release"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Set CI version
        run: |
          VERSION_NAME="1.1.${GITHUB_RUN_NUMBER}"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          sed -i "s/versionCode = [0-9]*/versionCode = ${GITHUB_RUN_NUMBER}/" app/build.gradle.kts
          sed -i "s/versionName = \"[0-9.]*\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts
          echo "ABATERY ${VERSION_NAME}"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Assemble release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify APKs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/ABATERY-v${VERSION_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "app/build/outputs/apk/release/ABATERY-v${VERSION_NAME}-release-unsigned.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ABATERY-v${{ env.VERSION_NAME }}-APKs
          path: |
            app/build/outputs/apk/debug/ABATERY-v${{ env.VERSION_NAME }}-debug.apk
            app/build/outputs/apk/release/ABATERY-v${{ env.VERSION_NAME }}-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add build summary
        run: |
          echo "## 📱 ABATERY v${VERSION_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Unit tests passed" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Debug APK assembled" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Release APK assembled (unsigned)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build:** #${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** ${GITHUB_SHA::12}" >> "$GITHUB_STEP_SUMMARY"
