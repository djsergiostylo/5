name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/stylo-battery-monitor-debug.apk

      - name: Upload debug APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: STYLO Battery Monitor - APK
          path: app/build/outputs/apk/debug/stylo-battery-monitor-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add APK download link to summary
        run: |
          echo "## 📱 STYLO Battery Monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### APK generada correctamente" >> "$GITHUB_STEP_SUMMARY"
          echo "[⬇️ Descargar APK]( ${{ steps.apk.outputs.artifact-url }} )" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \\`${GITHUB_SHA::12}\\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Build: #${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
