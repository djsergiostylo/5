<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ABATERI 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b10;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#v{width:100%;height:100%;display:block}
#hud{position:absolute;inset:12px;pointer-events:none;display:flex;flex-direction:column}
.badge{align-self:flex-start;padding:7px 11px;border:1px solid #ffffff22;border-radius:999px;background:#0b1119cc;backdrop-filter:blur(10px);font-size:10px;letter-spacing:1.25px;font-weight:800}
#pct{margin-left:auto;margin-top:-30px;font-size:30px;font-weight:900;letter-spacing:-1px;text-shadow:0 3px 18px #000}
#temp{margin-top:auto;font-size:12px;color:#b8c2ce;letter-spacing:.4px;text-shadow:0 2px 8px #000}
#hint{margin-top:7px;font-size:9px;color:#7e8a98;letter-spacing:1px;text-transform:uppercase}
#sim{align-self:flex-end;pointer-events:auto;margin-top:-27px;border:1px solid #ffffff22;background:#121a25e8;color:#fff;border-radius:12px;padding:9px 12px;font-weight:800;font-size:10px}
</style>
</head>
<body>
<canvas id="v"></canvas>
<div id="hud">
  <span class="badge">ABATERI · IMMERSIVE 3D TELEMETRY</span>
  <span id="pct">--%</span>
  <span id="temp">TEMPERATURA -- °C</span>
  <span id="hint">inclina el móvil · arrastra para explorar</span>
  <button id="sim">SIMULAR</button>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const canvas=document.getElementById('v');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x070b10);
scene.fog=new THREE.Fog(0x070b10,5,12);
const camera=new THREE.PerspectiveCamera(34,1,.1,50);
camera.position.set(3,2.4,5.2);
const controls=new OrbitControls(camera,canvas);
controls.enablePan=false;controls.enableDamping=true;controls.dampingFactor=.07;
controls.minDistance=3.2;controls.maxDistance=7;controls.autoRotate=true;controls.autoRotateSpeed=.28;

scene.add(new THREE.HemisphereLight(0xaed0ff,0x10151d,1.25));
const key=new THREE.DirectionalLight(0xffffff,2.7);key.position.set(3,5,4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
const rim=new THREE.PointLight(0x35d07f,12,8);rim.position.set(-3,1,2);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(7,64),new THREE.MeshStandardMaterial({color:0x0c1118,metalness:.45,roughness:.62}));
floor.rotation.x=-Math.PI/2;floor.position.y=-1.42;floor.receiveShadow=true;scene.add(floor);

const battery=new THREE.Group();scene.add(battery);
const bodyMat=new THREE.MeshStandardMaterial({color:0x202a36,metalness:.82,roughness:.23});
const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,3.5,.85),bodyMat);body.position.y=.35;body.castShadow=true;body.receiveShadow=true;battery.add(body);
const edge=new THREE.LineSegments(new THREE.EdgesGeometry(body.geometry),new THREE.LineBasicMaterial({color:0x8b98a8,transparent:true,opacity:.5}));edge.position.copy(body.position);battery.add(edge);
const liquidMat=new THREE.MeshPhysicalMaterial({color:0x35d07f,emissive:0x0b6b36,emissiveIntensity:.48,metalness:.12,roughness:.1,transparent:true,opacity:.9});
const liquid=new THREE.Mesh(new THREE.BoxGeometry(1.72,2.6,.5),liquidMat);liquid.position.set(0,-.35,.48);liquid.castShadow=true;battery.add(liquid);
const liquidGlow=new THREE.PointLight(0x35d07f,4,4);liquidGlow.position.set(0,0,1);battery.add(liquidGlow);
const top=new THREE.Mesh(new THREE.BoxGeometry(1.75,.12,.58),new THREE.MeshStandardMaterial({color:0x111820,metalness:.9,roughness:.18}));top.position.set(0,2.15,0);battery.add(top);
for(const x of[-.62,.62]){const t=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.25,32),new THREE.MeshStandardMaterial({color:0xc8d0d8,metalness:.96,roughness:.16}));t.position.set(x,2.32,0);t.castShadow=true;battery.add(t)}

const particles=new THREE.Group();
for(let i=0;i<60;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.012+Math.random()*.028,8,8),new THREE.MeshBasicMaterial({color:0x71ffae,transparent:true,opacity:.35+Math.random()*.25}));p.position.set((Math.random()-.5)*3,-1.15+Math.random()*4.3,(Math.random()-.5)*1.6);p.userData.phase=Math.random()*Math.PI*2;particles.add(p)}
scene.add(particles);

let data={level:72,temp:31};
let tilt={pitch:0,roll:0,yaw:0};
let targetTilt={pitch:0,roll:0,yaw:0};
function colorFor(t){return t>=45?0xff3b30:t>=40?0xffa726:0x35d07f}
function apply(){
 const c=colorFor(data.temp),hex='#'+c.toString(16).padStart(6,'0');
 liquid.scale.y=Math.max(.03,data.level/100);
 liquid.position.y=-1.65+1.3*data.level/100;
 liquidMat.color.set(c);liquidMat.emissive.set(c);rim.color.set(c);liquidGlow.color.set(c);
 document.getElementById('pct').textContent=Math.round(data.level)+'%';
 document.getElementById('temp').textContent='TEMPERATURA '+data.temp.toFixed(1)+' °C';
}
window.setBatteryData=(level,temp)=>{data={level:Number(level)||0,temp:Number(temp)||0};apply()};
window.setDeviceTilt=(pitch,roll,yaw)=>{targetTilt={pitch:Number(pitch)||0,roll:Number(roll)||0,yaw:Number(yaw)||0}};
document.getElementById('sim').onclick=()=>{data={level:15+Math.random()*85,temp:25+Math.random()*25};apply()};

let dragging=false,lastX=0,lastY=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;controls.autoRotate=false;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;lastX=e.clientX;lastY=e.clientY});
canvas.addEventListener('pointerup',()=>{dragging=false;controls.autoRotate=true});
function resize(){const w=Math.max(1,canvas.clientWidth),h=Math.max(1,canvas.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize,{passive:true});resize();apply();

function tick(t){
 const now=t*.001;
 tilt.pitch+=(targetTilt.pitch-tilt.pitch)*.08;tilt.roll+=(targetTilt.roll-tilt.roll)*.08;tilt.yaw+=(targetTilt.yaw-tilt.yaw)*.05;
 battery.rotation.x=THREE.MathUtils.degToRad(-tilt.pitch*.22);
 battery.rotation.z=THREE.MathUtils.degToRad(-tilt.roll*.32);
 battery.rotation.y=THREE.MathUtils.degToRad(tilt.yaw*.08);
 particles.rotation.y=now*.045;
 particles.children.forEach(p=>{p.position.y+=Math.sin(now*1.5+p.userData.phase)*.0007});
 controls.update();renderer.render(scene,camera);requestAnimationFrame(tick)
}
requestAnimationFrame(tick);
</script>
</body>
</html>
