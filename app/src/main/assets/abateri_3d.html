<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ABATERI 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d12;font-family:system-ui;color:#fff}#v{width:100%;height:100%;display:block}#hud{position:absolute;inset:12px;pointer-events:none}.badge{display:inline-block;padding:6px 10px;border:1px solid #ffffff22;border-radius:99px;background:#0b1119cc;backdrop-filter:blur(8px);font-size:11px;letter-spacing:1.2px;font-weight:700}#pct{position:absolute;right:0;top:0;font-size:28px;font-weight:800}#temp{position:absolute;left:0;bottom:4px;font-size:12px;color:#aab4c2}#sim{position:absolute;right:0;bottom:0;pointer-events:auto;border:1px solid #ffffff22;background:#121a25e8;color:#fff;border-radius:12px;padding:9px 12px;font-weight:700;font-size:11px}</style></head><body><canvas id="v"></canvas><div id="hud"><span class="badge">ABATERI · 3D TELEMETRY</span><span id="pct">--%</span><span id="temp">TEMPERATURA -- °C</span><button id="sim">SIMULAR DATOS</button></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';const canvas=document.getElementById('v'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x090d12,5,11);const camera=new THREE.PerspectiveCamera(34,1,.1,50);camera.position.set(3,2.4,5);const controls=new OrbitControls(camera,canvas);controls.enablePan=false;controls.enableDamping=true;controls.minDistance=3.5;controls.maxDistance=7;controls.autoRotate=true;controls.autoRotateSpeed=.35;const hemi=new THREE.HemisphereLight(0x9fc5ff,0x151a22,1.2);scene.add(hemi);const key=new THREE.DirectionalLight(0xffffff,2.5);key.position.set(3,5,4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);const rim=new THREE.PointLight(0x35d07f,12,8);rim.position.set(-3,1,2);scene.add(rim);const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x0c1118,metalness:.35,roughness:.58}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.35;floor.receiveShadow=true;scene.add(floor);const bodyMat=new THREE.MeshStandardMaterial({color:0x202a36,metalness:.78,roughness:.25});const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,3.5,.85),bodyMat);body.castShadow=true;body.position.y=.35;scene.add(body);const edge=new THREE.LineSegments(new THREE.EdgesGeometry(body.geometry),new THREE.LineBasicMaterial({color:0x6d7b8c,transparent:true,opacity:.55}));edge.position.copy(body.position);scene.add(edge);const liquidMat=new THREE.MeshPhysicalMaterial({color:0x35d07f,emissive:0x0b6b36,emissiveIntensity:.45,metalness:.1,roughness:.12,transparent:true,opacity:.92});const liquid=new THREE.Mesh(new THREE.BoxGeometry(1.72,2.6,.5),liquidMat);liquid.position.set(0,-.35,.48);liquid.castShadow=true;scene.add(liquid);const liquidGlow=new THREE.PointLight(0x35d07f,4,4);liquidGlow.position.set(0,0,1);scene.add(liquidGlow);const top=new THREE.Mesh(new THREE.BoxGeometry(1.75,.12,.58),new THREE.MeshStandardMaterial({color:0x111820,metalness:.85,roughness:.2}));top.position.set(0,2.15,0);scene.add(top);const terminals=[];for(const x of[-.62,.62]){const t=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.25,32),new THREE.MeshStandardMaterial({color:0xc4ccd5,metalness:.95,roughness:.18}));t.position.set(x,2.32,0);t.castShadow=true;scene.add(t);terminals.push(t)}const particles=new THREE.Group();for(let i=0;i<45;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.018+Math.random()*.028,8,8),new THREE.MeshBasicMaterial({color:0x71ffae,transparent:true,opacity:.45}));p.position.set((Math.random()-.5)*2.5,-1+Math.random()*4,(Math.random()-.5)*1.4);particles.add(p)}scene.add(particles);let data={level:72,temp:31};function colorFor(t){return t>=45?0xff3b30:t>=40?0xffa726:0x35d07f}function apply(){const c=colorFor(data.temp),hex='#'+c.toString(16).padStart(6,'0');liquid.scale.y=Math.max(.03,data.level/100);liquid.position.y=-1.65+1.3*data.level/100;liquidMat.color.set(c);liquidMat.emissive.set(c);rim.color.set(c);liquidGlow.color.set(c);document.getElementById('pct').textContent=Math.round(data.level)+'%';document.getElementById('temp').textContent='TEMPERATURA '+data.temp.toFixed(1)+' °C';}window.setBatteryData=(level,temp)=>{data={level:Number(level)||0,temp:Number(temp)||0};apply()};document.getElementById('sim').onclick=()=>{data={level:15+Math.random()*85,temp:25+Math.random()*25};apply()};canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;body.rotation.y=x*.55;body.rotation.x=-y*.3;edge.rotation.copy(body.rotation);});function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();apply();function tick(t){controls.update();particles.rotation.y=t*.00008;renderer.render(scene,camera);requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></body></html>
