(()=>{const c=document.getElementById('gl'),x=c.getContext('webgl',{antialias:false,alpha:true,powerPreference:'low-power'});if(!x){c.style.display='none';return}const vs=`attribute vec3 p;uniform mat4 m;varying vec3 v;void main(){v=p;gl_Position=m*vec4(p,1.);}`,fs=`precision mediump float;varying vec3 v;uniform vec3 col;void main(){float l=.55+.45*max(0.,dot(normalize(vec3(-.5,.8,1.)),normalize(v)));gl_FragColor=vec4(col*l,1.);}`;function sh(t,s){let q=x.createShader(t);x.shaderSource(q,s);x.compileShader(q);return q}let P=x.createProgram();x.attachShader(P,sh(x.VERTEX_SHADER,vs));x.attachShader(P,sh(x.FRAGMENT_SHADER,fs));x.linkProgram(P);x.useProgram(P);let a=x.getAttribLocation(P,'p'),um=x.getUniformLocation(P,'m'),uc=x.getUniformLocation(P,'col');const box=(w,h,d)=>{let X=w/2,Y=h/2,Z=d/2;return new Float32Array([-X,-Y,-Z,X,-Y,-Z,X,Y,-Z,-X,Y,-Z,-X,-Y,Z,X,-Y,Z,X,Y,Z,-X,Y,Z,-X,-Y,-Z,-X,Y,-Z,-X,Y,Z,-X,-Y,Z,X,-Y,-Z,X,Y,-Z,X,Y,Z,X,-Y,Z,-X,Y,-Z,X,Y,-Z,X,Y,Z,-X,Y,Z,-X,Y,-Z,-X,-Y,-Z,X,-Y,-Z,X,-Y,Z,-X,-Y,Z])};let pos=x.createBuffer();x.bindBuffer(x.ARRAY_BUFFER,pos);x.enableVertexAttribArray(a);x.vertexAttribPointer(a,3,x.FLOAT,false,0,0);let items=[{g:box(3.9,.34,2.35),z:0,col:[.08,.12,.11]},{g:box(3.5,.24,1.95),z:-.01,col:[.12,.22,.16]},{g:box(3.15,.16,1.62),z:-.02,col:[.04,.65,.24]},{g:box(.16,.72,1.95),x:-1.68,col:[.3,.38,.34]},{g:box(.16,.72,1.95),x:1.68,col:[.3,.38,.34]}];let idx=new Uint16Array([0,1,2,0,2,3,4,6,5,4,7,6,0,4,5,0,5,1,3,2,6,3,6,7,1,5,6,1,6,2,0,3,7,0,7,4]);function mat(rx,ry,s){let c=Math.cos(rx),d=Math.sin(rx),e=Math.cos(ry),f=Math.sin(ry);return new Float32Array([e,0,-f,0,d*f,c,d*e,0,c*f,-d,e*c,0,0,0,0,1])}let ry=.35,rx=.12,tr=.0,go=false;function draw(t){let w=c.clientWidth,h=c.clientHeight;if(c.width!==w||c.height!==h){c.width=w;c.height=h;x.viewport(0,0,w,h)}x.clearColor(0,0,0,0);x.enable(x.DEPTH_TEST);x.clear(x.COLOR_BUFFER_BIT|x.DEPTH_BUFFER_BIT);ry+=(tr-ry)*.06;rx+=(go?.18:rx)*.01;for(let i=0;i<items.length;i++){let q=items[i],g=q.g;x.bindBuffe
